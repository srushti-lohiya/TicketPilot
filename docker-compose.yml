
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/ticketpilot.db
    volumes:
      - ticketpilot_data:/data
    restart: unless-stopped

  dashboard:
    build: .
    command:
      - streamlit
      - run
      - dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ticketpilot_data:
